kilde düzenlendiği ve ilgili sosyal medya gönderilerinin görsel olarak çekici bir biçimde satır aralarına eklendiği, yemek planının görsel ve ilgi çekici bir artifaktını oluştur. Oluşturduğun artifaktın çok kısa bir özetini sunarak yanıt ver.\",\"1K5yTM\":\"Mevsime uygun bir yaz yemeği yap\",\"3M6BtD\":\"Mevsimlik ve yerel malzemeler kullanarak popüler bir tarif belirle. Bu tarifi, sunulan alternatif malzemeler ve medya seçenekleriyle ilgi çekici ve etkileşimli bir görsel materyale dönüştür.\",\"3VY2zN\":\"Kore usulü bir barbekü akşam yemeği planla\",\"170syz\":\"Evde geleneksel bir Kore barbeküsü (K-BBQ) akşam yemeğinin nasıl hazırlanacağını adım adım anlatan zengin ve ilgi çekici bir içerik oluştur.\",\"3SCT3N\":\"Özel ilgi alanları rehberi oluştur\",\"2lPGTe\":\"İlgi duyabileceğimi düşündüğün bir konuda, testler de içeren 10 günlük bir çalışma planına sahip zengin görselli bir artifakt oluştur\",\"3QPefy\":\"Mükemmel bir cumartesi planla\",\"4xHM83\":\"Önümüzdeki cumartesi günü planım yok. 3 alt temsilci çalıştır ve bana 3 seçenek sun: açık hava etkinliği, kültürel bir etkinlik ve tembellik içeren bir şey; hepsi de yakınımda olsun. Bu hafta sonu civarımda nelerin popüler olduğunu ve gerçekleşen etkinlikleri kontrol et. Bana seçeneklerimi gösteren satır içi içerik ekle.\",\"1grHMR\":\"Yeni başlayanlar için bir koşu planı oluştur\",\"3kWxPB\":\"Koşmaya başlamak istiyorum ama deneyimim yok. Bana 0'dan 5 kilometreye ulaşmamı sağlayacak bir hazırlık planı ve 1. haftadan sonra pes etmemem için ipuçları vermek üzere alt temsilciler kullan.\",\"2C99tr\":\"20 dakikalık kolay akşam yemekleri bul\",\"1FbnXx\":\"Instagram'da popüler olan şeylere göre 20 dakikada hazırlanabilen 3 kolay akşam yemeği (biri vejetaryen, biri tavuklu, biri makarnalı) bulmaları için 3 alt temsilci çalıştır.\",\"4iUIVD\":\"Tüm temiz enerji türlerini karşılaştır\",\"XgbM9\":\"Güneş, rüzgar, hidroelektrik, nükleer ve jeotermal enerji kaynaklarını adım adım açıkla. Her birinin enerji kaynağını elektriğe nasıl dönüştürdüğünü açıklamaları için alt temsilciler görevlendir. Yüksek düzeyde bir bilgi grafiği ve birkaç çizelge oluştur.\",\"4zbgkA\":\"Benim için bir lookbook oluştur\",\"4B4RrG\":\"Instagram zevkime göre gerçekten seveceğim yükselen markalarla benim için bir görünüm defteri oluştur. Gerçekten satın alabileceğim parçalar bul ve bunlar hakkında bilgi ver. Her görünüm için ayrı bir sayfa oluştur; parçaları stil panosu gibi bir araya getirerek tek bakışta nasıl kombinlendiklerini görebilmemi sağla. Zengin bir görsel deneyim sunmak için her görünüme atmosferini anlatan kısa bir not ve ilgili Reels videoları ekle. Sayfalarını çevirebileceğim şık bir moda dergisi hissi versin.\",\"44DStf\":\"Notları çalışma kılavuzuna dönüştür\",\"2TehQh\":\"El yazısıyla aldığım notların resmini gönderiyorum. Bunları metne geçir ve ne kadar iyi anladığımı test etmek için konular halinde düzenlenmiş, etkileşimli bir artefakt oluştur.\",\"2Pjmv8\":\"Takvimimi ve e-postamı özetle\",\"2iqhus\":\"E-posta gelen kutumu ve takvimimi oku ve önümüzdeki hafta yapmam gereken işleri ilgi çekici bir şekilde özetle. Gruplandırılmış bölümler oluştur ve her iş için net bir madde işareti ekle. Özellikle e-posta gelen kutuma odaklan. Takvimimdeki etkinlikleri tek tek listeleme, sadece yapmam gereken işleri vurgula. Mevcut tarih/saati dikkate al, geçmişteki etkinliklere atıfta bulunma. Bunu hızlıca oluştur! E-postamı veya takvimimi henüz bağlamadıysam önce bunu yapmama yardımcı ol. Oluşturduktan sonra bunu günlük planlanan bir görev haline getirmek isteyip istemediğimi sor.\",\"2gJBxQ\":\"Günlük 20 dakikalık bir antrenman oluştur\",\"B8bS6\":\"Her gün saat 06:00'da çalışacak günlük bir görev oluştur. Her sabah bana evde, ekipman gerektirmeyen, yaklaşık 20 dakikalık bir egzersiz programı ver. Hafta boyunca çeşitlilik sağlaması ve kademeli olarak ilerlemesi için her gün farklı kas gruplarına odaklanacak şekilde programı değiştir. O günün odak noktasını ve egzersizin ne kadar zorlayıcı hissettirmesi g
