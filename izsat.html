<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>İz Sayacı v2</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#14181a; --surface:#1e2528; --surface-2:#262f33; --amber:#ffb020; --alert:#e4432c; --ok:#4caf6d; --text:#f2f0ea; --text-dim:#8c9599; --border:#323b3f; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{margin:0;padding:0;height:100%;width:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100dvh;width:100vw;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:max(12px, env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--border);}
  .brand{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);}
  .gps-pill{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--border);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);} .dot.searching{background:var(--amber);animation:pulse 1s infinite;} .dot.live{background:var(--ok);} .dot.off{background:var(--alert);}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 20px;}
  .label{font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--text-dim);}
  .counter{font-family:'Oswald',sans-serif;font-weight:700;font-size:min(38vw,200px);line-height:.9;color:var(--amber);display:flex;align-items:baseline;gap:10px;}
  .slash,.target{color:var(--text-dim);font-size:.4em;font-weight:500;}
  .dots{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center;max-width:300px;}
  .field-dot{width:16px;height:16px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);transition:.2s} .field-dot.filled{background:var(--amber);border-color:var(--amber);transform:scale(1.1);}
  .heading-row{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--text-dim);font-size:13px;font-weight:600;}
  .compass{width:22px;height:22px;transition:transform .2s linear;}
  .controls{padding:14px 16px max(14px, env(safe-area-inset-bottom)) 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border);}
  .row{display:flex;gap:10px;} .btn{flex:1;border:none;border-radius:14px;padding:16px 10px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;} .btn:active{transform:scale(.96)} .btn-primary{background:var(--amber);color:#1a1400} .btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)} .btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border)}
  .target-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 14px;}
  .target-label{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-dim);}
  .stepper{display:flex;align-items:center;gap:14px;} .stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:20px;font-weight:700} .stepper .n{font-family:'Oswald';font-size:24px;min-width:28px;text-align:center;}
  #app.alert{background:var(--alert)} #app.alert .counter{color:#fff} .alert-banner{display:none;position:fixed;inset:0;z-index:5;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:rgba(228,67,44,.95)} #app.alert .alert-banner{display:flex} .alert-text{font-family:'Oswald';font-weight:700;font-size:15vw;color:#fff} .alert-sub{color:rgba(255,255,255,.9);font-weight:600;letter-spacing:.1em;text-transform:uppercase} .ack-btn{background:#fff;color:var(--alert);border:none;border-radius:16px;padding:18px 40px;font-size:17px;font-weight:700}
  .permission-screen{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px;text-align:center} .permission-screen h1{font-family:'Oswald';font-size:22px;margin:0} .permission-screen p{color:var(--text-dim);font-size:14px;line-height:1.5;max-width:340px;margin:0}
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><div class="brand">İz Sayacı v2</div><div class="gps-pill"><div class="dot searching" id="gpsDot"></div><span id="gpsText">Aranıyor</span></div></div>
  <div class="main">
    <div class="label">Geçiş</div>
    <div class="counter"><span id="countNum">0</span><span class="slash">/</span><span class="target" id="targetNum">3</span></div>
    <div class="dots" id="dotsRow"></div>
    <div class="heading-row"><svg class="compass" id="compassIcon" viewBox="0 0 24 24" fill="none"><path d="M12 2 L15 12 L12 22 L9 12 Z" fill="currentColor"/></svg><span id="headingText">Yön bekleniyor</span></div>
    <div class="heading-row" style="margin-top:4px;font-size:11px;opacity:.7"><span id="debugText">Durum: bekleniyor</span></div>
    <div class="heading-row" style="font-size:11px;opacity:.6"><span id="sensorText"></span></div>
  </div>
  <div class="alert-banner"><div class="alert-text">İZ AÇ!</div><div class="alert-sub">Hidrolik kolu çekin</div><button class="ack-btn" id="ackBtn">Tamam, İz Açtım</button></div>
  <div class="controls">
    <div class="target-row"><span class="target-label">Kaç geçişte bir</span><div class="stepper"><button id="minus">–</button><span class="n" id="nDisplay">3</span><button id="plus">+</button></div></div>
    <div class="row"><button class="btn btn-secondary" id="manualBtn">+1 Geçiş</button><button class="btn btn-ghost" id="soundBtn">🔊 Ses</button></div>
    <div class="row"><button class="btn btn-ghost" id="resetBtn">Sıfırla</button><button class="btn btn-ghost" id="testBtn">Test: Döndür</button></div>
  </div>
</div>
<div class="permission-screen" id="permScreen"><h1>Konum İzni Gerekli</h1><p>GPS + pusula için izin ver. Arabada deniyorsan telefonu ön cama sabitle, ekran kapanmasın diye açık tutacağım.</p><button class="btn btn-primary" id="startBtn" style="max-width:240px">Başlat</button></div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const app=$('app'), countNum=$('countNum'), targetNum=$('targetNum'), nDisplay=$('nDisplay'), dotsRow=$('dotsRow'), gpsDot=$('gpsDot'), gpsText=$('gpsText'), headingText=$('headingText'), debugText=$('debugText'), sensorText=$('sensorText'), compassIcon=$('compassIcon'), permScreen=$('permScreen');
  let target=3, count=0, soundOn=true;
  const MIN_SPEED=0.8, MIN_TIME_BETWEEN_TURNS=5000; // dönüşler arası min. bekleme: tek dönüşün 2 kez sayılmasını önler
  let lastTurn=0;

  // ---- DÖNÜŞ ALGILAMA (sabit referans + tek eşik + kendi içinde doğrulama) ----
  const TURN_THRESHOLD = 90;   // referanstan bu kadar (derece) sapınca "dönüş" say
  const SETTLE_RATE   = 6;     // art arda örnekler arası fark bu değerin altına inince "sabitlendi" kabul et
  const SETTLE_MS     = 1000;  // sabit kalması gereken süre (ms) -> gürültüden gelen sahte tetiklemeleri eler
  const SMOOTH_ALPHA  = 0.35;  // ham açıyı yumuşatma katsayısı (pusula/GPS gürültüsünü azaltır)

  let refHeading = null;       // Başlat / Sıfırla anında kilitlenen referans yön
  let smoothedHeading = null;  // yumuşatılmış anlık yön (referans SABİT kalır, bu kayar)
  let turning = false;         // 90°'yi geçtik mi, onay bekleniyor mu
  let peakDelta = 0;           // dönüş sırasında görülen en büyük sapma (doğrulama için)
  let settleStart = null;      // sabitlenmenin başladığı zaman damgası

  function angDiff(a,b){ let d=Math.abs(a-b)%360; return d>180?360-d:d; }
  function lerpAngle(a,b,t){ let diff=((b-a+540)%360)-180; return (a+diff*t+360)%360; }

  function render(){
    countNum.textContent=count; targetNum.textContent=target; nDisplay.textContent=target; dotsRow.innerHTML='';
    const filled = count%target===0&&count>0?target:count%target;
    for(let i=0;i<target;i++){ const d=document.createElement('div'); d.className='field-dot'+(i<filled?' filled':''); dotsRow.appendChild(d); }
  }

  let ctx, osc, interval;
  function startSiren(){ if(!soundOn||interval) return; try{ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); osc=ctx.createOscillator(); const g=ctx.createGain(); osc.type='sawtooth'; g.gain.value=.28; osc.connect(g); g.connect(ctx.destination); osc.frequency.value=600; osc.start(); let f=600, dir=1; interval=setInterval(()=>{f+=dir*60; if(f>=1200){dir=-1} if(f<=500){dir=1} osc.frequency.setValueAtTime(f,ctx.currentTime);},70);}catch(e){} }
  function stopSiren(){ if(interval) clearInterval(interval); interval=null; if(osc) try{osc.stop()}catch(e){} osc=null; }
  function trigger(){ app.classList.add('alert'); startSiren(); if(navigator.vibrate) navigator.vibrate([300,150,300,150,400]); }
  function clearAlert(){ app.classList.remove('alert'); stopSiren(); }
  function addPass(){ count++; render(); if(count%target===0) trigger(); }

  // Dönüş algılama durumunu tamamen sıfırlar; bir sonraki gelen açı örneği yeni referans olur.
  function resetTurnState(){
    refHeading=null; smoothedHeading=null; turning=false; peakDelta=0; settleStart=null;
  }

  function handleHeading(h, source){
    // 1) Referans yoksa (Başlat / Sıfırla sonrası ilk okuma): burayı referans olarak kilitle
    if(refHeading===null){
      refHeading=h; smoothedHeading=h; turning=false; peakDelta=0; settleStart=null;
      debugText.textContent=`Referans kilitlendi: ${Math.round(h)}° [${source}]`;
      compassIcon.style.transform=`rotate(${h}deg)`;
      headingText.textContent=`${Math.round(h)}° (${source})`;
      return;
    }

    // 2) Gürültüyü azaltmak için ham açıyı yumuşat (referans buna göre KAYMAZ, sabit kalır)
    smoothedHeading = lerpAngle(smoothedHeading, h, SMOOTH_ALPHA);
    const delta = angDiff(smoothedHeading, refHeading);

    if(!turning){
      if(delta > TURN_THRESHOLD){
        // Referanstan 90°'den fazla sapıldı -> dönüş başladı, onay bekleniyor
        turning = true; peakDelta = delta; settleStart = null;
        debugText.textContent=`DÖNÜŞ ALGILANDI Δ${Math.round(delta)}° — sabitlenmesi bekleniyor`;
      }else{
        debugText.textContent=`Düz gidiliyor | ref ${Math.round(refHeading)}° | Δ${Math.round(delta)}°`;
      }
    }else{
      peakDelta = Math.max(peakDelta, delta);
      const jitter = angDiff(smoothedHeading, lastSmoothedForJitter());
      if(jitter < SETTLE_RATE){
        if(settleStart===null) settleStart=Date.now();
        const settled = Date.now()-settleStart;
        debugText.textContent=`Sabitleniyor ${(settled/1000).toFixed(1)}s/${(SETTLE_MS/1000).toFixed(1)}s | maxΔ${Math.round(peakDelta)}°`;
        if(settled > SETTLE_MS){
          // DOĞRULAMA: yeterince büyük sapma (>90°) + zaman aralığı kuralı sağlanıyorsa say
          if(peakDelta > TURN_THRESHOLD && Date.now()-lastTurn > MIN_TIME_BETWEEN_TURNS){
            lastTurn = Date.now();
            addPass();
            debugText.textContent = `GEÇİŞ SAYILDI ✓ maxΔ${Math.round(peakDelta)}°`;
          }else{
            debugText.textContent = `Onaylanmadı (çok yakın zamanda başka dönüş sayıldı)`;
          }
          // Yeni yön artık yeni referans: bir sonraki dönüş buna göre ölçülecek
          refHeading = smoothedHeading;
          turning = false; peakDelta = 0; settleStart = null;
        }
      }else{
        settleStart = null; // hâlâ hareket ediyor, sabitlenme sayacını başa sar
        debugText.textContent = `Hâlâ dönüyor | Δref ${Math.round(delta)}°`;
      }
    }

    lastSmoothedForJitter(smoothedHeading); // son değeri kaydet (bir sonraki jitter hesabı için)
    compassIcon.style.transform = `rotate(${h}deg)`;
    headingText.textContent = `${Math.round(h)}° (${source})`;
  }

  // Küçük yardımcı: bir önceki smoothedHeading değerini saklamak için basit closure-tabanlı bellek
  const lastSmoothedForJitter = (function(){
    let prev = null;
    return function(newVal){
      if(newVal===undefined) return prev===null? smoothedHeading : prev;
      prev = newVal;
    };
  })();

  // Pusula
  function onOrient(e){
    let h=null;
    if(e.webkitCompassHeading!=null) h=e.webkitCompassHeading;
    else if(e.alpha!=null) h=(360 - e.alpha)%360;
    if(h==null||isNaN(h)) return;
    sensorText.textContent=`pusula: ${Math.round(h)}°`;
    handleHeading(h, 'pusula');
  }
  // GPS
  function onPos(p){
    gpsDot.className='dot live'; const s=p.coords.speed; const hd=p.coords.heading;
    gpsText.textContent = s!=null?`${(s*3.6).toFixed(1)} km/h`:'Canlı';
    if(hd!=null && s!=null && s>MIN_SPEED){
      sensorText.textContent=`GPS hız ${(s*3.6).toFixed(1)} km/h heading ${Math.round(hd)}°`;
      handleHeading(hd, 'GPS');
    }
  }
  function onErr(e){ gpsDot.className='dot off'; gpsText.textContent='Konum yok'; }

  async function start(){
    permScreen.style.display='none';
    resetTurnState(); // Başlat anındaki ilk okuma yeni referans olacak
    try{ if(navigator.wakeLock) await navigator.wakeLock.request('screen'); }catch(e){}
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      try{ const r=await DeviceOrientationEvent.requestPermission(); if(r==='granted') window.addEventListener('deviceorientation', onOrient, true); }catch(e){}
    }else{
      window.addEventListener('deviceorientationabsolute', onOrient, true);
      window.addEventListener('deviceorientation', onOrient, true);
    }
    if(navigator.geolocation) navigator.geolocation.watchPosition(onPos, onErr, {enableHighAccuracy:true, maximumAge:0, timeout:8000});
  }

  $('startBtn').addEventListener('click', start);
  $('manualBtn').addEventListener('click', addPass);
  $('ackBtn').addEventListener('click', ()=>{ count=0; render(); clearAlert(); });
  $('resetBtn').addEventListener('click', ()=>{
    count=0; render(); clearAlert();
    resetTurnState();      // referans + dönüş durumu tamamen temizlenir
    lastTurn=0;
    debugText.textContent='Sıfırlandı — bulunduğunuz nokta yeni referans olacak';
  });
  $('plus').addEventListener('click', ()=>{target=Math.min(20,target+1); render();});
  $('minus').addEventListener('click', ()=>{target=Math.max(1,target-1); render();});
  $('soundBtn').addEventListener('click', function(){ soundOn=!soundOn; this.textContent=soundOn?'🔊 Ses':'🔇 Ses'; if(!soundOn) stopSiren(); });
  $('testBtn').addEventListener('click', ()=>{
    // 180 derecelik gerçek bir U dönüşünü simüle eder
    let fake = ((refHeading||0) + 180 + 360) % 360;
    handleHeading(fake, 'test');
    setTimeout(()=> handleHeading(fake, 'test'), 300);
    setTimeout(()=> handleHeading(fake, 'test'), 700);
    setTimeout(()=> handleHeading(fake, 'test'), 1100);
    setTimeout(()=> handleHeading(fake, 'test'), 1400);
  });
  render();
})();
</script>
</body>
</html>
